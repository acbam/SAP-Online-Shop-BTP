_schema-version: 3.3.0
ID: btp-online-store
description: A simple CAP project.
version: 1.0.0
modules:
- name: btp-online-store-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: btp-online-store-db
  - name: btp-online-store-auth
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    readiness-health-check-http-endpoint: /health
    readiness-health-check-type: http
  build-parameters:
    builder: npm
- name: btp-online-store-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: btp-online-store-db
  parameters:
    buildpack: nodejs_buildpack
- name: btp-online-store-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: btp-online-store-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - onlinestore.zip
      name: onlinestore
      target-path: resources/
- name: onlinestore
  type: html5
  path: app/online-store
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: btp-online-store-destination-content
  type: com.sap.application.content
  requires:
  - name: btp-online-store-destination-service
    parameters:
      content-target: true
  - name: btp-online-store-repo-host
    parameters:
      service-key:
        name: btp-online-store-repo-host-key
  - name: btp-online-store-auth
    parameters:
      service-key:
        name: btp-online-store-key
  parameters:
    content:
      instance:
        destinations:
        - Name: onelinestore_router_btp_online_store_repo_host
          ServiceInstanceName: btp-online-store-html5-srv
          ServiceKeyName: btp-online-store-repo-host-key
          sap.cloud.service: onelinestore-router
        - Authentication: OAuth2UserTokenExchange
          Name: onelinestore_router_uaa_btp_online_store
          ServiceInstanceName: btp-online-store-auth
          ServiceKeyName: btp-online-store-key
          sap.cloud.service: onelinestore-router
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
resources:
- name: btp-online-store-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: btp-online-store-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: btp-online-store-html5-srv
    service-plan: app-host
- name: btp-online-store-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
            - Authentication: NoAuthentication
              HTML5.DynamicDestination: true
              HTML5.ForwardAuthToken: true
              Name: btp-online-store-srv-api
              ProxyType: Internet
              Type: HTTP
              URL: ~{srv-api/srv-url}
          existing_destinations_policy: ignore
      version: 1.0.0
    service: destination
    service-name: btp-online-store-destination-service
    service-plan: lite
  requires:
      - name: srv-api
- name: btp-online-store-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: btp-online-store
    path: ./xs-security.json
    service: xsuaa
    service-name: btp-online-store-auth
    service-plan: application
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
